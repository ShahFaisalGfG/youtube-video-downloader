name: Tests

# Runs on every push and pull request, on the oldest and newest supported Python. The tests mock
# yt-dlp, ffprobe, and every other program, so they never contact YouTube.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
        python-version: ['3.11', '3.14']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # The script itself uses only the standard library; pytest is for the tests.
      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
